<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Batch Production Dashboard - PNB Digital</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Live Power BI dashboard integration example by PNB Digital." />
  <style>
    :root {
      --primary: #002473;
      --accent: #00c4a7;
      --bg: #050816;
      --text: #f5f7fb;
      --muted: #9ba4c4;
      --card-bg: #0b1020;
      --border: #1d2340;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      background: radial-gradient(circle at top left, #07112b, #02030a 55%);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(2, 3, 10, 0.8);
      backdrop-filter: blur(10px);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      text-decoration: none;
      color: var(--text);
    }
    .logo-mark {
      width: 32px;
      height: 32px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--primary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #02030a;
    }
    .back-btn {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.2s;
    }
    .back-btn:hover {
      background: rgba(15, 24, 55, 0.9);
      color: var(--text);
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 24px;
    }
    .dashboard-header {
      text-align: center;
      margin-bottom: 30px;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
    }
    h1 span {
      color: var(--accent);
    }
    .subtitle {
      color: var(--muted);
      font-size: 1rem;
    }
    .iframe-container {
      width: 100%;
      max-width: 1100px;
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
      aspect-ratio: 16 / 9;
      position: relative;
    }
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    @media (max-width: 768px) {
      .iframe-container {
        aspect-ratio: 4 / 3;
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="logo">
      <div class="logo-mark">P</div>
      <div>
        <div>PNB Digital</div>
        <small style="color: var(--muted); font-size: 0.75rem;">Data • BI • Automation</small>
      </div>
    </a>
    <a href="/" class="back-btn">← Back to main site</a>
  </header>
  <main>
    <div class="dashboard-header">
      <h1>Batch <span>Production Dashboard</span> v1</h1>
      <p class="subtitle">Live Power BI integration example.</p>
    </div>
    <div class="iframe-container">
      <iframe title="Batch - Production Dashboard v1" src="https://app.powerbi.com/view?r=eyJrIjoiNmQyMDg3ZDMtOTg0OC00OTU5LWE5ZDUtYmI2YjJlYTg3N2IxIiwidCI6IjFmNTQ2YzYzLTdhYmUtNDRjYy04YWNlLTA1OTI1ZmM4YzIyYiIsImMiOjR9" allowFullScreen="true"></iframe>
    </div>
  </main>
</body>
</html>
